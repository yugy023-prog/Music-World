<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music World</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Background layers used for the crossfade + custom photo slideshow -->
    <div id="bg-layer-a" class="bg-layer"></div>
    <div id="bg-layer-b" class="bg-layer"></div>

    <header id="headers" class="heading"> 
        <h1> Music World</h1>

    </header>
    <div id="box" class="container">
        <aside id="sides" class="sidebar">
            <div class="search-tab">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search Music</span>
            </div>
            <div class="sidebar-content">
                <input type="text" id="search-input" placeholder="Search your music...">
                <section id="search" class="search-list">
                    <ul id="musics" class="music-list">
                        <!-- music list will come here -->
                    </ul>
                </section>
            </div>
        </aside>

        <main id="Cont" class="content">
            <!-- main website -->

        </main>
    </div>


<div id="p1" class="player">

    <div id="ove1" class="overlay">

        <!-- Song Details -->
        <div id="sf" class="song-info">
            <h2 id="song-title">Song Title</h2>
            <p id="artist-name">Artist Name</p>
        </div>

        <!-- Progress Bar -->
        <div id="pro1" class="progress">

            <span id="current-time">0:00</span>

            <div id="bar1" class="bar">
                <div class="fill" id="progress-fill"></div>
            </div>

            <span id="duration">0:00</span>

        </div>

        <!-- Controls -->
        <div id="contr1" class="controls">

            <i class="fa-solid fa-shuffle" id="shuffle" title="Shuffle"></i>

            <i class="fa-solid fa-backward-step" id="prev" title="Previous"></i>

            <button id="play-btn">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>

            <i class="fa-solid fa-forward-step" id="next" title="Next"></i>

            <i class="fa-solid fa-repeat" id="repeat" title="Repeat"></i>

        </div>

        <!-- Background photo picker -->
        <div id="bg-controls" class="bg-controls">

            <button id="bg-picker-btn" title="Choose background photos from your device">
                <i class="fa-solid fa-images"></i>
                <span id="bg-picker-label">Background</span>
            </button>

            <input type="file" id="bg-file-input" accept="image/*" multiple hidden>

            <button id="bg-clear-btn" title="Use album art instead" hidden>
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

    </div>

</div>

<!-- Hidden Audio -->
<audio id="audio"></audio>

<script src="script.js"></script>








</body>
</html>
